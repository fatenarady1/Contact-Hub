  <section id="main-section" >
    <div class="container">


<!-- Button -->



<!-- Modal -->
        <div
          class="modal fade"
          id="contactModal"
          tabindex="-1"
          aria-labelledby="contactModalLabel"
         >

          <div class="modal-dialog">
            <div class="modal-content">

              <!-- Modal Header -->
              <div class="modal-header">
                <h1 class="modal-title fs-5 fw-bold" id="contactModalLabel">
                  Add New Contact
                </h1>

                <button
                  type="button"
                  class="btn-close  close"
                  data-bs-dismiss="modal"
                  aria-label="Close">

                </button>
              </div>

              <!-- Modal Body -->
              <div class="modal-body">

                <form>

                  <div class="mb-3 ">
                    <label for="name" class="form-label">
                    Full Name <span class="red">*</span>
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      placeholder="Enter full name" required>
                  </div>


                  <div class="mb-3">
                    <label for="phone" class="form-label">
                      Phone Number <span class="red">*</span>
                    </label>

                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      placeholder="e.g., 01012345678">
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">
                      Email Address
                    </label>

                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="name@example.com">
                  </div>

                  <div class="mb-3">
                    <label for="address" class="form-label">
                      Address
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="address"
                      placeholder="Enter address">
                  </div>


                  <div class="mb-3">
                    <label for="group" class="form-label">
                      Group
                    </label>

                    <select class="form-select" id="group" aria-label="Default select example">
                      <option selected>Select a group</option>
                      <option value="Family">Family</option>
                      <option value="Friends">Friends</option>
                      <option value="Work">Work</option>
                      <option value="School">School</option>
                      <option value="School">School</option>
                      <option value="Other">Other</option>
                    </select>

                  </div>


                  <div class="mb-3">
                    <label for="floatingTextarea" class="form-label">
                      Notes
                    </label>


                    <textarea class="form-control" 
                    placeholder="Add notes about this contact"
                    id="floatingTextarea"></textarea>
        
                  
                  </div>

                  <div class="mb-3 col-6 d-flex gap-3">

                    <div class="form-check">
                      <input class="form-check-input shadow-none rounded-0 border-2" type="checkbox" value="" id="favorite">
                      <label class="form-check-label fw-medium d-flex align-items-center flex-nowrap" for="favorite">
                        <i class="fa-solid fa-star me-1"></i> <span>Favorite</span>
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input shadow-none rounded-0 border-2" type="checkbox" value="" id="emergency" checked>
                      <label class="form-check-label fw-medium d-flex align-items-center flex-nowrap" for="emergency">
                        <i class="fa-solid fa-heart-pulse me-1"></i><span>Emergency</span>
                      </label>
                    </div>
                  </div>




              

                </form>

              </div>

              <!-- Modal Footer -->
              <div class="modal-footer d-flex flex-nowrap justify-content-center">

                <button
                  type="button "
                  class="btn secondary  col-5"
                  data-bs-dismiss="modal">
                  Cancel
                </button>

                <button onclick="addNumber()"
                data-bs-dismiss="modal"
                  type="button"
                  class="btn primary col-6 text-white fw-medium">
                  <i class="fa-solid fa-check"></i> Save Contact
                </button>

              </div>

            </div>
